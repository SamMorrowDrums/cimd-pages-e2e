name: CIMD client request (pilot)
description: >-
  Request a hosted OAuth Client ID Metadata Document (CIMD) for a local /
  loopback OAuth client. PILOT: currently restricted to an allow-listed set
  of GitHub accounts (see README). Not a general public service yet.
title: "[cimd] "
labels: ["cimd-request"]
body:
  - type: markdown
    attributes:
      value: |
        This opens an issue that a GitHub Actions workflow reads to publish a
        client metadata document under this repo's GitHub Pages site. You
        need a GitHub account to open the issue; no repo write access is
        required. The workflow validates your input and rejects anything
        that isn't a loopback (127.0.0.1 / localhost / [::1]) redirect URI.
  - type: input
    id: app_name
    attributes:
      label: App name
      description: >-
        Short human-readable name for your app. Letters, numbers, spaces,
        hyphens and underscores only, max 40 characters.
      placeholder: My Local Tool
    validations:
      required: true
  - type: input
    id: redirect_uri
    attributes:
      label: Loopback redirect URI
      description: >-
        Must be http://127.0.0.1:PORT/path, http://localhost:PORT/path or
        http://[::1]:PORT/path. No other hosts or schemes are accepted.
      placeholder: http://127.0.0.1:8765/callback
    validations:
      required: true
